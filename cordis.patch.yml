# dsh-meta-skills bundle patch.
#
# `dsh.bundle.patch` in package.json points here. A profile that lists this
# package in `dsh.profile.bundles` merges this layer, and the single `insert`
# below mounts the plugin's Host half as the loader row `meta-skills`. The row
# name is the package name, so the loader resolves `lib/index.js` (the package's
# `.` export) from the profile's `node_modules`, which is where the relative
# `link:` dependency puts this checkout.
#
# EXACTLY ONE `insert` ROW AND NO DISABLED GUARD, so a profile that consumes this
# package has exactly one row for it and no second mount source can appear by
# editing this file alone.
#
# THERE IS NO ROW FOR A MEMBER. `dsh-skill-evolution`,
# `dsh-tools-skills-evolve` and `dsh-evolution-console` keep their OWN rows in the
# profile's bundle list: this package composes them over their prefixes and never
# mounts, replaces or unmounts them (`D-0352` rules 1 and 3). A fused row that
# also claimed a member's id would be the deletion this decision forbids, arriving
# as configuration.
#
# There is no `mcp` row either: this plugin registers HTTP routes under its own
# prefix through `ctx.webServer.register` and exposes no Model Context Protocol
# server.
- insert:
    - id: meta-skills
      name: 'dsh-meta-skills'
